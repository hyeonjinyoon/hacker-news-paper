<!doctype html>
<!--
  사이트 공유 이미지(og:image, wwwroot/og.png)의 원본. 1200×630으로 찍어 PNG로 저장한다.
  글꼴(Pretendard)을 CDN에서 받으므로 인터넷이 연결된 상태에서 저장소 루트에서 실행한다.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot="$PWD/src/HnPaper.Web/wwwroot/og.png" "file://$PWD/scripts/og-image.html"
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 색은 사이트(paper.css)와 같다 */
  :root{--fg:#111;--sub:#5a5a5a;--muted:#767676;--line:#e5e5e5;--accent:#008689;--ph:#f2f9f9}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
  body{display:flex;flex-direction:column;padding:60px 72px 64px;color:var(--fg);font-family:"Pretendard Variable",Pretendard,sans-serif;
    -webkit-font-smoothing:antialiased;word-break:keep-all}

  .masthead{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:30px;border-bottom:6px solid var(--fg)}
  .logo{display:flex;align-items:baseline;gap:14px;font-weight:800;font-size:100px;letter-spacing:-.045em;line-height:.9}
  .logo small{font-size:38px;font-weight:600;letter-spacing:0}
  .issue{text-align:right;font-size:21px;line-height:1.55;color:var(--muted);padding-bottom:4px}
  .issue b{color:var(--fg);font-weight:700}

  .body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;margin-top:40px}
  .copy{display:flex;flex-direction:column;justify-content:space-between;padding-right:44px;border-right:1px solid var(--line)}
  .copy h1{font-size:54px;font-weight:700;letter-spacing:-.035em;line-height:1.3}
  .copy p{font-size:25px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
  .copy p span{color:var(--line);margin:0 10px;font-weight:400}

  /* 오른쪽: 1면 기사 칸을 줄여 그린 그림(사진 + 제목 줄, 아래 기사 한 줄) */
  .card{padding-left:44px}
  .thumb{aspect-ratio:16/9;background:var(--ph) url("../src/HnPaper.Web/wwwroot/img/gradients/g05.webp") center/cover}
  .bar{height:15px;margin-top:16px;background:#d6d6d6;border-radius:2px}
  .bar.short{width:62%;margin-top:11px}
  .bar.meta{width:44%;height:10px;margin-top:16px;background:var(--line)}
  .next{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .next .bar{width:86%;margin-top:0}
</style>
</head>
<body>
  <header class="masthead">
    <div class="logo">Hacker News<small>paper</small></div>
    <div class="issue">매일 아침 발행<br><b>한국어판</b></div>
  </header>
  <main class="body">
    <div class="copy">
      <h1>전날 Hacker News 1면<br>상위 30개 글을<br>매일 아침 한국어로</h1>
      <p>제목 번역<span>|</span>원문 요약<span>|</span>댓글 번역</p>
    </div>
    <div class="card" aria-hidden="true">
      <div class="thumb"></div>
      <div class="bar"></div>
      <div class="bar short"></div>
      <div class="bar meta"></div>
      <div class="next"><div class="bar"></div></div>
    </div>
  </main>
</body>
</html>
